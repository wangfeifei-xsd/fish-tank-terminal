## IDF Component Manager Manifest File
dependencies:
  lvgl/lvgl: ^8.4.0
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: 2.12.9
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    - if: idf_version <6.1
    version: '>=1.3.1'
  espressif/cjson: ^1.7.18
  idf:
    version: '>=5.0.0'
  espressif/esp_lcd_ek79007: ^1.0.2
